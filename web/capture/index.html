<main>
  <h1>웅캡처 꾸미기</h1>
  <p class="lead">캡처한 그림에 펜 · 화살표 · 글자를 넣고, 가려야 할 곳은 모자이크해요. 그림은 서버로 올라가지 않아요.</p>

  <div id="drop" class="drop">
    <strong>캡처한 그림을 여기에 놓거나, Ctrl+V 로 붙여 넣으세요</strong>
    <span>눌러서 고르기도 돼요</span>
    <input id="file" type="file" accept="image/*" hidden>
  </div>
  <div class="bar">
    <button class="btn" id="b-shot" hidden>🖥 화면 찍기</button>
    <span class="pcnote" style="margin:0">단축키로 바로 찍으려면 <a href="https://joese0211.github.io/woong/" target="_blank" rel="noopener">PC판 웅캡처</a></span>
  </div>
  <div id="msg" class="msg" role="status"></div>

  <section id="editor" class="hide">
    <div class="bar tools" id="tools">
      <button class="btn on" data-t="pen">✏ 펜</button>
      <button class="btn" data-t="hl">🖍 형광펜</button>
      <button class="btn" data-t="rect">▭ 네모</button>
      <button class="btn" data-t="arrow">➜ 화살표</button>
      <button class="btn" data-t="text">T 글자</button>
      <button class="btn" data-t="mosaic">▦ 모자이크</button>
    </div>
    <div class="bar">
      <label class="row-inline" style="gap:6px">색 <input type="color" id="color" value="#c8291f"></label>
      <select id="width" aria-label="굵기"><option value="1">얇게</option><option value="2" selected>보통</option><option value="4">굵게</option></select>
      <button class="btn" id="b-undo">↶ 되돌리기</button>
      <button class="btn" id="b-redo">↷ 다시</button>
      <span class="grow"></span>
      <button class="btn" id="b-copy">복사</button>
      <button class="btn primary" id="b-save">PNG 받기</button>
    </div>
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  </section>
</main>
