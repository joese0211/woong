<main>
  <h1><img class="ico" src="../assets/zip-oIXSUVWg.webp" alt="" width="55" height="55">웅집</h1>
  <p class="lead">압축 파일을 놓으면 풀어 주고, 일반 파일을 놓으면 ZIP으로 묶어 줘요. 파일은 서버로 올라가지 않아요.</p>

  <div id="drop" class="drop">
    <strong>파일이나 폴더를 여기에 놓으세요</strong>
    <span>ZIP · 7Z · RAR · TAR 등 압축 파일 → 풀기 / 그 밖의 파일 → 묶기</span>
    <input id="file" type="file" multiple hidden>
  </div>
  <div id="msg" class="msg" role="status"></div>
  <div id="panel" class="msg hide"></div>

  <section id="open" class="hide">
    <div class="bar">
      <strong id="o-title" class="grow"></strong>
      <button class="btn" id="o-zip">모두 ZIP 하나로 받기</button>
      <button class="btn primary" id="o-dir">폴더에 모두 풀기</button>
    </div>
    <div id="o-list" class="list"></div>
  </section>

  <section id="make" class="hide">
    <div class="bar">
      <strong id="m-title" class="grow"></strong>
      <button class="btn sm" id="m-clear">비우기</button>
    </div>
    <div id="m-list" class="list"></div>
    <div class="bar">
      <label class="f">모양
        <select id="m-fmt"><option value="zip">ZIP (누구나 열 수 있어요)</option><option value="7z">7Z (더 작게 묶어요)</option></select>
      </label>
      <label class="f">암호 (없으면 비워 두세요)
        <input id="m-pw" type="password" autocomplete="new-password" placeholder="선택">
      </label>
      <span class="grow"></span>
      <button class="btn primary" id="m-go">묶어서 받기</button>
    </div>
    <p class="pcnote">암호를 잊으면 풀 수 없으니 꼭 적어 두세요.</p>
  </section>
</main>
