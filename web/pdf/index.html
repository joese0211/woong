  <h1><img class="ico" src="../assets/pdf-D3fPzVLH.webp" alt="" width="55" height="55">웅PDF</h1>
  <p class="lead">PDF를 합치고, 나누고, 돌리고, 페이지를 지워요. 글자만 뽑아 마크다운으로 바꾸면 클로드 · 챗GPT에 바로 붙여 넣을 수 있어요. 파일은 서버로 올라가지 않아요.</p>

  <div id="drop" class="drop">
    <strong>PDF 파일을 여기에 놓으세요</strong>
    <span>또는 눌러서 고르기 · 여러 개를 한꺼번에 놓으면 합쳐져요 · 사진(JPG·PNG)도 PDF 쪽이 돼요</span>
    <input id="file" type="file" accept="application/pdf,image/*" multiple hidden>
  </div>
  <div id="msg" class="msg" role="status"></div>

  <section id="work" class="hide">
    <div class="bar" id="tools">
      <button class="btn" id="b-add">＋ 파일 더 넣기</button>
      <button class="btn" id="b-rot">↻ 돌리기</button>
      <button class="btn" id="b-del">🗑 지우기</button>
      <button class="btn" id="b-left" title="선택한 쪽을 앞으로">◀ 앞으로</button>
      <button class="btn" id="b-right" title="선택한 쪽을 뒤로">뒤로 ▶</button>
      <button class="btn" id="b-all">모두 선택</button>
    </div>
    <div class="bar">
      <button class="btn" id="b-split">나누기…</button>
      <button class="btn" id="b-img">그림(PNG)으로</button>
      <button class="btn" id="b-md" title="글자만 뽑아 마크다운(.md)으로 — 클로드 · 챗GPT에 넣기 좋아요">마크다운으로</button>
      <button class="btn" id="b-pw">암호…</button>
      <span class="grow"></span>
      <button class="btn primary" id="b-save">PDF 받기</button>
    </div>
    <div id="panel" class="msg hide"></div>
    <p class="pcnote" id="count"></p>
    <div id="thumbs" class="thumbs"></div>
