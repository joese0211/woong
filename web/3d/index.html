<body>

  </nav>

<main>
  <h1><img class="ico" src="../assets/3d-gIA4G-uK.webp" alt="" width="55" height="55">웅3D</h1>
  <p class="lead">SVG 그림이나 글자를 입체로 만들어요. 파일은 서버로 올라가지 않아요.</p>

  <section id="start" class="start">
    <div id="drop" class="drop">
      <strong>SVG 파일을 여기에 놓으세요</strong>
      <span>또는 눌러서 고르기</span>
      <input id="file" type="file" accept=".svg,image/svg+xml" hidden>
    </div>
    <button class="btn textbtn" id="b-text" type="button">글자로 만들기</button>
  </section>
  <div id="loadbox" class="hide">
    <p class="pcnote" id="loadtxt"></p>
    <div class="progress"><i id="loadbar"></i></div>
  </div>
  <div id="msg" class="msg" role="status"></div>

  <section id="work" class="hide">
    <div class="work">
      <div class="stage" id="stage">
        <button class="btn home" id="b-home" type="button">← 처음으로</button>
      </div>
      <aside class="panel" id="panel">
        <div class="handle">
          <button class="btn" id="h-tog" type="button">조절 ▲</button>
          <button class="btn primary" id="h-exp" type="button">받기</button>
        </div>
        <div class="pbody" id="pbody">
          <div class="sec" id="sec-src">
            <label class="f hide" id="row-txt">글자<input type="text" id="txt" maxlength="30" value="웅툴즈" autocomplete="off"></label>
            <div class="row-inline hide" id="row-svg"><span class="nm" id="svgname"></span><button class="btn" id="b-other" type="button">다른 SVG</button></div>
          </div>
          <div class="sec">
            <label class="f">두께<input type="range" id="r-thick" min="0.02" max="1" step="0.01" value="0.25"></label>
            <label class="f">모서리 둥글기<input type="range" id="r-bevel" min="0" max="1" step="0.01" value="0.3"></label>
          </div>
          <div class="sec">
            <div class="f">재질</div>
            <div class="seg" id="seg-mat">
              <button class="btn on" type="button" data-v="matte">무광</button><button class="btn" type="button" data-v="gloss">유광</button><button class="btn" type="button" data-v="metal">금속</button>
            </div>
            <div class="row-inline">
              <input type="color" id="c-color" value="#c8291f" aria-label="색">
              <label class="chk"><input type="checkbox" id="k-unify"> 한 가지 색으로 통일</label>
            </div>
          </div>
          <div class="sec">
            <label class="f">조명 방향<input type="range" id="r-light" min="0" max="360" step="1" value="40"></label>
            <div class="f">배경</div>
            <div class="row-inline">
              <div class="seg" id="seg-bg">
                <button class="btn on" type="button" data-v="clear">투명</button><button class="btn" type="button" data-v="color">색</button>
              </div>
              <input type="color" id="c-bg" value="#ffffff" aria-label="배경색" class="hide">
            </div>
            <label class="chk"><input type="checkbox" id="k-spin" checked> 천천히 돌기</label>
          </div>
          <div class="sec" id="sec-exp">
            <div class="f">받기</div>
            <div class="row-inline">
              <select id="s-png" aria-label="그림 크기"><option value="1080">보통 1080</option><option value="2048">2K</option><option value="4096">4K</option></select>
              <button class="btn primary" id="b-png" type="button">PNG 받기</button>
            </div>
            <div class="row-inline" id="row-vid">
              <select id="s-fps" aria-label="초당 장면 수"><option value="30">30fps</option><option value="60">60fps</option></select>
              <button class="btn" id="b-vid" type="button">영상 받기</button>
            </div>
            <p class="pcnote" id="vidnote"></p>
            <div class="row-inline">
              <button class="btn" id="b-glb" type="button">GLB</button>
              <button class="btn" id="b-stl" type="button">STL</button>
              <button class="btn" id="b-obj" type="button">OBJ</button>
            </div>
            <div id="xmsg" class="msg" role="status"></div>
          </div>
        </div>
      </aside>
    </div>
  </section>
</main>
